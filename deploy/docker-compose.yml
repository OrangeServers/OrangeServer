# OrangeServer production Compose.
# Bundled mode starts exactly four product containers:
# app (Gunicorn + SPA), worker (Celery prefork), MySQL, and Redis 8.
#
# Bundled:
#   docker compose --env-file .env -f deploy/docker-compose.yml --profile bundled up -d --build
# External MySQL/Redis:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build app worker

services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${OGS_BACKEND_IMAGE:-orangeserver-backend}:${OGS_BACKEND_TAG:-latest}
    restart: unless-stopped
    networks: [ogs-internal]
    env_file:
      - ../backend/.env
    environment:
      OGS_ENV: prod
      OGS_BIND_HOST: 0.0.0.0
      OGS_PORT: 28000
      OGS_MYSQL_HOST: ${OGS_MYSQL_HOST:-mysql}
      OGS_MYSQL_PORT: ${OGS_MYSQL_PORT:-3306}
      OGS_MYSQL_DBNAME: ${OGS_MYSQL_DBNAME:-orange}
      OGS_MYSQL_USER: ${OGS_MYSQL_USER:-app_user}
      OGS_MYSQL_PASSWORD: ${OGS_MYSQL_PASSWORD}
      OGS_REDIS_HOST: ${OGS_REDIS_HOST:-redis}
      OGS_REDIS_PORT: ${OGS_REDIS_PORT:-6379}
      OGS_REDIS_DB: ${OGS_REDIS_DB:-2}
      OGS_REDIS_MAX_CONNECTIONS: ${OGS_REDIS_MAX_CONNECTIONS:-256}
      OGS_REDIS_PASSWORD: ${OGS_REDIS_PASSWORD:-}
      OGS_AI_AUTONOMY_ENABLED: ${OGS_AI_AUTONOMY_ENABLED:-true}
      OGS_AI_AUTONOMY_REDIS_HOST: ${OGS_AI_AUTONOMY_REDIS_HOST:-redis}
      OGS_AI_AUTONOMY_REDIS_PORT: ${OGS_AI_AUTONOMY_REDIS_PORT:-6379}
      OGS_AI_AUTONOMY_REDIS_PASSWORD: ${OGS_REDIS_PASSWORD:-}
      OGS_AI_ALERTMANAGER_TOKEN: ${OGS_AI_ALERTMANAGER_TOKEN:-}
      OGS_AI_ALERTMANAGER_OWNER: ${OGS_AI_ALERTMANAGER_OWNER:-}
      OGS_AI_PROMETHEUS_BASE_URL: ${OGS_AI_PROMETHEUS_BASE_URL:-}
      OGS_AI_PROMETHEUS_BEARER_TOKEN: ${OGS_AI_PROMETHEUS_BEARER_TOKEN:-}
      OGS_AI_EMBEDDING_MODEL_PATH: /opt/orangeserver/models/fast-bge-small-zh-v1.5
      OGS_PROXY_LAYERS: "0"
      OGS_HTTPS: "${OGS_HTTPS:-false}"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    ports:
      - "${OGS_HTTP_PORT:-8080}:28000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:28000/local/health', timeout=2); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  worker:
    image: ${OGS_BACKEND_IMAGE:-orangeserver-backend}:${OGS_BACKEND_TAG:-latest}
    restart: unless-stopped
    working_dir: /app
    networks: [ogs-internal]
    env_file:
      - ../backend/.env
    environment:
      OGS_ENV: prod
      OGS_MYSQL_HOST: ${OGS_MYSQL_HOST:-mysql}
      OGS_MYSQL_PORT: ${OGS_MYSQL_PORT:-3306}
      OGS_MYSQL_DBNAME: ${OGS_MYSQL_DBNAME:-orange}
      OGS_MYSQL_USER: ${OGS_MYSQL_USER:-app_user}
      OGS_MYSQL_PASSWORD: ${OGS_MYSQL_PASSWORD}
      OGS_REDIS_HOST: ${OGS_REDIS_HOST:-redis}
      OGS_REDIS_PORT: ${OGS_REDIS_PORT:-6379}
      OGS_REDIS_DB: ${OGS_REDIS_DB:-2}
      OGS_REDIS_MAX_CONNECTIONS: ${OGS_REDIS_MAX_CONNECTIONS:-256}
      OGS_REDIS_PASSWORD: ${OGS_REDIS_PASSWORD:-}
      OGS_AI_AUTONOMY_ENABLED: ${OGS_AI_AUTONOMY_ENABLED:-true}
      OGS_AI_AUTONOMY_REDIS_HOST: ${OGS_AI_AUTONOMY_REDIS_HOST:-redis}
      OGS_AI_AUTONOMY_REDIS_PORT: ${OGS_AI_AUTONOMY_REDIS_PORT:-6379}
      OGS_AI_AUTONOMY_REDIS_PASSWORD: ${OGS_REDIS_PASSWORD:-}
      OGS_AUTONOMY_WORKER_CONCURRENCY: ${OGS_AUTONOMY_WORKER_CONCURRENCY:-2}
      OGS_AI_EMBEDDING_MODEL_PATH: /opt/orangeserver/models/fast-bge-small-zh-v1.5
    command:
      - celery
      - -A
      - app.ai.autonomy.celery_entry:celery_app
      - worker
      - --loglevel=INFO
    volumes:
      - backend-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from app.ai.autonomy.readiness import checkpoint_readiness, worker_readiness; raise SystemExit(0 if checkpoint_readiness() and worker_readiness() else 1)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: ${OGS_REDIS_IMAGE:-redis:8.10.0}
    profiles: [bundled]
    restart: unless-stopped
    networks: [ogs-internal]
    environment:
      OGS_REDIS_PASSWORD: ${OGS_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec
        --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass
        "$$OGS_REDIS_PASSWORD"
    volumes:
      # Keep the M1 volume name so existing LangGraph checkpoints survive.
      - autonomy-redis-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "if [ -n \"$$OGS_REDIS_PASSWORD\" ]; then redis-cli -a \"$$OGS_REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: ${OGS_MYSQL_IMAGE:-mysql:8.0.42}
    profiles: [bundled]
    restart: unless-stopped
    networks: [ogs-internal]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OGS_MYSQL_DBNAME:-orange}
      MYSQL_USER: ${OGS_MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${OGS_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/mysqldir/orange.sql:/docker-entrypoint-initdb.d/orange.sql:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  ogs-internal:
    driver: bridge

volumes:
  mysql-data:
  backend-data:
  autonomy-redis-data:

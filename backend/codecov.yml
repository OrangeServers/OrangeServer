# =============================================================================
# Codecov configuration (ti2-COV)
# =============================================================================
# 目标: ≥60% line + branch coverage
# 当前: 14% 基线 (按 batch 2/3 累计, 全量数据待 CI runner 验证)
# 排除: __init__.py, 迁移 SQL

codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1

coverage:
  precision: 1
  round: down
  range: "60...80"

  status:
    project:
      default:
        target: 60%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 5%

# 排除文件 (与 .coveragerc 一致, Codecov 会二次确认)
ignore:
  - "backend/app/**/__init__.py"
  - "backend/app/__init__.py"
  - "backend/tests/**"
  - "backend/mysqldir/**"
  - "frontend/**"
  - "deploy/**"
  - "ops/**"
  - "docs/**"

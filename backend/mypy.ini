# OrangeServer mypy configuration (ti3-HINT)
# Gradual strictness: critical-path modules strict, others as soft warnings.
# Critical path: api/auth/audit  (entry points, business contract)
# Soft-warning: users/assets/ssh/cron/tools/local/files/core  (allow mypy errors, no CI fail)
#
# Run:
#   cd backend && mypy --config-file mypy.ini app/api app/auth app/audit  # 0 errors required
#   cd backend && mypy --config-file mypy.ini app                          # full (looser)
#
# ti3-HINT plan: Phase A -> 0 errors on critical path. Phase B -> gradually tighten modules.

[mypy]
python_version = 3.12
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = skip
show_error_codes = True
show_column_numbers = True
pretty = True
color_output = True
exclude = (app/tools/migrate_comma_to_junction\.py$|app/tools/auto_update\.py$|^app/users/|^app/assets/|^app/ssh/|^app/cron/|^app/tools/|^app/local/|^app/files/|^app/core/)
cache_dir = .mypy_cache
incremental = True


# === Critical path: enforce 0 errors ===
[mypy-app.api.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
check_untyped_defs = True

[mypy-app.auth.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
check_untyped_defs = True

[mypy-app.audit.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
check_untyped_defs = True


# === Soft-warning modules: allow untyped defs (will tighten in ti3-HINT-Phase B) ===
[mypy-app.users.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.assets.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.ssh.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.cron.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.tools.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.local.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.files.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

[mypy-app.core.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
